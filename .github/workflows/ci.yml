name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Module boundaries and code style
        run: ./gradlew checkModuleBoundaries ktlintCheck
      - name: Build
        run: ./gradlew assembleDebug assembleRelease
      - name: Unit tests
        run: ./gradlew test
      - name: Android Lint
        run: ./gradlew lint
      - name: Record component screenshots (light and dark)
        run: ./gradlew :core:design:recordRoborazziDebug
      - name: Upload component screenshots
        uses: actions/upload-artifact@v4
        with:
          name: component-screenshots
          path: core/design/build/outputs/roborazzi/
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run macrobenchmarks on a managed emulator
        run: >
          ./gradlew :benchmark:pixel6Api34BenchmarkReleaseAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=app.duenorth.tasks.benchmark.StartupBenchmark
      - name: Check budgets (constitution Principle II)
        run: python3 scripts/check_benchmark_budgets.py benchmark/build/outputs
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/build/outputs/
