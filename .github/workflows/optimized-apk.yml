name: Optimized APK

# Builds the "optimized" (benchmarkRelease) APK people sideload, signed with the shared debug key
# whose hashes are registered with Google and Microsoft sign-in. Runs only when started by hand.
# Repository secrets it reads (Settings > Secrets and variables > Actions):
#   DEBUG_KEYSTORE_BASE64                                 (due-north-debug.keystore, base64 -w0)
#   GOOGLE_WEBCLIENTID, MSAL_CLIENTID, MSAL_SIGNATUREHASH  (sign-in; the hash is the debug key's)
# See docs/release/README.md.

on:
  workflow_dispatch:

concurrency:
  group: optimized-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Signed optimized APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEBCLIENTID: ${{ secrets.GOOGLE_WEBCLIENTID }}
      MSAL_CLIENTID: ${{ secrets.MSAL_CLIENTID }}
      MSAL_SIGNATUREHASH: ${{ secrets.MSAL_SIGNATUREHASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          for name in DEBUG_KEYSTORE_BASE64 GOOGLE_WEBCLIENTID MSAL_CLIENTID MSAL_SIGNATUREHASH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; see docs/release/README.md"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/debug.keystore"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "DEBUG_STOREFILE=$keystore" >> "$GITHUB_ENV"
          # The SHA-1 the APK must be signed with, checked after the build.
          sha1=$(keytool -list -v -alias androiddebugkey -keystore "$keystore" -storepass android \
            | sed -n 's/^[[:space:]]*SHA1: //p' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$sha1" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not a readable debug keystore (alias androiddebugkey, password android)"
            exit 1
          fi
          echo "Debug key SHA-1: $sha1"
          echo "DEBUG_SHA1=$sha1" >> "$GITHUB_ENV"
      - name: Build the APK
        run: ./gradlew :app:assembleBenchmarkRelease
      - name: Name the APK and show its signer
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          apk="due-north-optimized-$version-$(date -u +%Y%m%d).apk"
          cp app/build/outputs/apk/benchmarkRelease/app-benchmarkRelease.apk "$apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk" | tee signer.txt | grep -E "SHA-1|SHA-256"
          if ! grep -q "SHA-1 digest: $DEBUG_SHA1" signer.txt; then
            echo "::error::The APK is not signed with the key in DEBUG_KEYSTORE_BASE64 ($DEBUG_SHA1)"
            exit 1
          fi
          echo "APK=$apk" >> "$GITHUB_ENV"
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: optimized-apk
          path: ${{ env.APK }}
