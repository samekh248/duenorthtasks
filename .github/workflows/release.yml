name: Release

# Builds a signed Play bundle (T068). Runs only when started by hand or by pushing a v* tag.
# Repository secrets it reads (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64, RELEASE_STOREPASSWORD, RELEASE_KEYALIAS, RELEASE_KEYPASSWORD  (upload key)
#   GOOGLE_WEBCLIENTID, MSAL_CLIENTID, MSAL_RELEASESIGNATUREHASH                           (sign-in)
#   PLAY_SERVICE_ACCOUNT_JSON  (optional; without it the bundle is only attached to the run)
# See docs/release/README.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    name: Signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEBCLIENTID: ${{ secrets.GOOGLE_WEBCLIENTID }}
      MSAL_CLIENTID: ${{ secrets.MSAL_CLIENTID }}
      MSAL_RELEASESIGNATUREHASH: ${{ secrets.MSAL_RELEASESIGNATUREHASH }}
      RELEASE_STOREPASSWORD: ${{ secrets.RELEASE_STOREPASSWORD }}
      RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
      RELEASE_KEYPASSWORD: ${{ secrets.RELEASE_KEYPASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the upload key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set; see docs/release/README.md"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "RELEASE_STOREFILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          # Play needs a higher versionCode on every upload.
          echo "APP_VERSIONCODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew test
      - name: Build the bundle
        run: ./gradlew :app:bundleRelease
      - name: Upload the bundle and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
      - name: Send to Play internal testing as a draft
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.duenorth.tasks
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          # A draft waits for a person to press "roll out" in Play Console.
          status: draft
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
